name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One Pages deployment at a time. Queued runs are not cancelled, so a push that
# lands mid-deploy still ships instead of being silently dropped.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # A wedged install burned 1m11s before crashing; without a cap a stuck step
    # can hold a runner for hours.
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Node 24, not 22, deliberately. npm 10.9.8 — the version Node 22 bundles
      # — crashes on GitHub-hosted runners with "npm error Exit handler never
      # called!". That is an internal npm fault, not a problem with
      # package-lock.json: this exact lockfile installs cleanly on npm 10.9.2
      # and 11.16 on macOS, and on npm 10.9.8 on linux/x64 in Docker as both
      # root and non-root. It reproduces only on the runner. Node 24 ships
      # npm 11.17, which is unaffected, and gets there without having to
      # bootstrap through the broken npm. Local development runs Node 26/npm 11.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # No `cache: npm`: a restored ~/.npm was one of the suspects for the crash
      # above, and installing 98 packages cold takes about five seconds.
      - name: Install dependencies
        run: |
          npm ci --no-audit --no-fund && exit 0
          echo "::warning::npm ci failed; falling back to npm install"
          rm -rf node_modules
          npm install --no-audit --no-fund

      # An npm-internal crash prints no stack trace to the step log — it only
      # writes one to ~/.npm/_logs. Without this there is nothing to diagnose.
      - name: Collect npm logs
        if: failure()
        run: |
          mkdir -p /tmp/npm-logs
          cp -r "$HOME/.npm/_logs/." /tmp/npm-logs/ 2>/dev/null || true

      - name: Upload npm logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: npm-debug-log
          path: /tmp/npm-logs
          if-no-files-found: ignore

      - name: Run tests
        run: npm test

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build
        # These are Actions *variables*, not secrets, deliberately. Vite inlines
        # them into the bundle, so they are public either way; marking them
        # secret would imply a confidentiality the deployed site cannot provide.
        # Full reasoning in the Security model section of README.md.
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
          VITE_GOOGLE_API_KEY: ${{ vars.VITE_GOOGLE_API_KEY }}
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
