name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One Pages deployment at a time. Queued runs are not cancelled, so a push that
# lands mid-deploy still ships instead of being silently dropped.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # A hung npm install once burned 1m11s before crashing; without a cap a
    # wedged step can occupy a runner for hours.
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        # `npm ci` has failed here with "npm error Exit handler never called!",
        # an npm-internal crash rather than a problem with package-lock.json —
        # the same lockfile installs cleanly on both npm 10 and npm 11. The
        # usual triggers are a registry flake or a corrupt restored ~/.npm
        # cache, so retry once from a cleared cache before failing the deploy.
        run: |
          npm ci --no-audit --no-fund && exit 0
          echo "::warning::npm ci failed; clearing the npm cache and retrying once"
          npm cache clean --force
          rm -rf node_modules
          npm ci --no-audit --no-fund

      - name: Run tests
        run: npm test

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build
        # These are Actions *variables*, not secrets, deliberately. Vite inlines
        # them into the bundle, so they are public either way; marking them
        # secret would imply a confidentiality the deployed site cannot provide.
        # Full reasoning in the Security model section of README.md.
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
          VITE_GOOGLE_API_KEY: ${{ vars.VITE_GOOGLE_API_KEY }}
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
