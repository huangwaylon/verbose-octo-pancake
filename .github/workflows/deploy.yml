name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One Pages deployment at a time. Queued runs are not cancelled, so a push that
# lands mid-deploy still ships instead of being silently dropped.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # A wedged install burned 1m11s before crashing; without a cap a stuck step
    # can hold a runner for hours.
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Node 24 ships npm 11. Note that the npm version was never the cause of
      # the "Exit handler never called!" install failures — see the lockfile
      # registry gotcha in CLAUDE.md — but there is no reason to go back to 22.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # An npm-internal crash prints no stack trace to the step log — it only
      # writes one to ~/.npm/_logs. Uploading it is what finally identified the
      # private-registry URLs baked into package-lock.json, so it stays.
      - name: Collect npm logs
        if: failure()
        run: |
          mkdir -p /tmp/npm-logs
          cp -r "$HOME/.npm/_logs/." /tmp/npm-logs/ 2>/dev/null || true

      - name: Upload npm logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: npm-debug-log
          path: /tmp/npm-logs
          if-no-files-found: ignore

      # JavaScript only, and the same command a developer runs. A lost format run
      # once left 18 spaces inside JSX, which is a real text node in the output.
      - name: Check formatting
        run: npm run format:check

      - name: Run tests
        run: npm test

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build
        # An Actions *variable*, not a secret, deliberately. Vite inlines it into
        # the bundle, so it is public either way; marking it secret would imply a
        # confidentiality the deployed site cannot provide. It is only the token
        # endpoint's address — the app key never appears in a build at all.
        # Full reasoning in the Security model section of README.md.
        env:
          VITE_SCRIPT_URL: ${{ vars.VITE_SCRIPT_URL }}
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
