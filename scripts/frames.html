<!doctype html>
<!-- Screenshot harness. Each page gets its own iframe, so container and media
     queries resolve against a real viewport rather than a resized window — a
     resized headless window quietly reports a width you did not ask for.

     The readout under each frame is the assertion: sideways scroll is measured,
     not eyeballed, and the header's height is checked against --header-height from
     62rem up, which is where `.layout__aside`'s sticky offset reads that token from
     outside the header. Below 62rem the band may legitimately be taller than the
     token, because the direction line wraps and nothing offsets by it.

     On an overlay page the sheet is the whole screen, so it is measured too — and
     because `--keyboard-inset` is a custom property the harness can set it directly,
     which is the only way to see the state the sheet's whole geometry exists for.
     `visualViewport` cannot be faked, but the property it feeds can.

     Height matters as much as width once a panel is 100dvh: pass h=852 for an
     iPhone 15, h=667 for an SE.

       npx vite-node scripts/preview.jsx
       python3 -m http.server 8899
       .../Google Chrome --headless --virtual-time-budget=3000 --screenshot=out.png \
         --window-size=1400,1000 \
         'http://127.0.0.1:8899/scripts/frames.html?page=preview-en-form&w=320,393&h=852'

     --virtual-time-budget outlasts the backdrop's fade-in, which starts at opacity 0:
     without it a screenshot catches a half-transparent scrim. The panel's own slide-up
     is not a factor — measureSheet disables it before measuring anything.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>frames</title>
<style>
  body { margin: 0; background: #2b2b2b; font: 11px/1.5 -apple-system, sans-serif; color: #fff; }
  .row { display: flex; align-items: flex-start; gap: 10px; padding: 10px; }
  figure { margin: 0; }
  figcaption { padding: 3px 0; white-space: pre; }
  .bad { color: #ff8f7a; font-weight: 700; }
  .ok { color: #8fe3a8; }
  iframe { border: 0; background: #fff; display: block; }
</style>
</head>
<body>
<div class="row" id="row"></div>
<script>
  const params = new URLSearchParams(location.search)
  const page = params.get('page') || 'preview-en'
  const widths = (params.get('w') || '320,393,430,768,1440').split(',').map(Number)
  const height = Number(params.get('h') || 852)
  /* The iPhone SE decimal keypad, the same figure test/viewport.test.js uses. */
  const keyboard = Number(params.get('keyboard') || 336)
  const row = document.getElementById('row')

  const bad = (text) => '<span class="bad">' + text + '</span>'
  const ok = (text) => '<span class="ok">' + text + '</span>'
  const check = (pass, good, wrong) => (pass ? ok(good) : bad(wrong))

  /**
   * A custom property comes back from getComputedStyle UNRESOLVED — "4.625rem" — so
   * parsing it and assuming rem would report nonsense the moment the token is written
   * in px. Let layout resolve it instead.
   */
  function resolve(doc, property) {
    const probe = doc.createElement('div')
    probe.style.height = 'var(' + property + ')'
    doc.body.append(probe)
    const height = probe.getBoundingClientRect().height
    probe.remove()
    return height
  }

  /**
   * The sheet, which below 48rem IS the screen. Four things no eye can judge: that a
   * full-screen panel fills the viewport exactly rather than leaving a band or
   * overflowing; that a dialog above the breakpoint still floats; that Save is above
   * the keyboard; and sideways scroll INSIDE the body, which `overflow-x: hidden`
   * clips — so the document-level check cannot see a field off the right edge.
   */
  function measureSheet(doc, lines) {
    const panel = doc.querySelector('.sheet__panel')
    if (!panel) return
    const header = doc.querySelector('.sheet__header')
    const body = doc.querySelector('.sheet__body')
    const footer = doc.querySelector('.sheet__footer')
    const viewport = doc.documentElement.clientHeight
    const full = panel.classList.contains('sheet__panel--full')
    // The panel slides up from translateY, and this runs on `load` — so without
    // this every measurement below would be the animation's first frame, reported as
    // a panel 24px too low and a Save button 24px under the keyboard.
    panel.style.animation = 'none'
    const dialog = doc.defaultView.matchMedia('(min-width: 48rem)').matches
    const box = panel.getBoundingClientRect()

    lines.push(
      'panel ' +
        Math.round(box.height) +
        'px ' +
        (full ? 'full' : 'content-sized') +
        (dialog ? ' dialog' : ''),
    )
    if (full && !dialog) {
      // Both edges. `top` is compared against ZERO, not against --safe-top: the panel
      // pads INTO its top inset, so the inset is inside its border box. A gap means the
      // height term is wrong; an overflow means something is added on top of a height
      // that already filled the screen.
      lines.push(
        '  fills ' +
          check(
            Math.abs(box.top) <= 1 && Math.abs(box.bottom - viewport) <= 1,
            'exactly',
            'TOP ' + Math.round(box.top) + ' BOTTOM ' + Math.round(box.bottom) + '/' + viewport,
          ),
      )
    }
    if (dialog && header && body && footer) {
      // Floating is not enough on its own: a panel left at the phone's `height` is capped
      // by max-height to 44rem, which still floats. Being TALLER THAN ITS CONTENT is what
      // shows it, so this compares the panel against the height its three parts need.
      // Honest limit: the only sheet that opts into full screen today has more content
      // than the cap, so it sits at 44rem either way and reads as content-sized here
      // whether or not the reset is present — `test/styles.test.js` is what pins that
      // reset. This catches a SHORT full-screen panel, which is the shape a future
      // opt-in would add.
      const natural =
        header.getBoundingClientRect().height +
        body.scrollHeight +
        footer.getBoundingClientRect().height
      lines.push(
        '  dialog ' +
          check(
            box.top > 0 && box.bottom < viewport && box.height <= natural + 2,
            'floats, content-sized',
            box.height > natural + 2
              ? 'STRETCHED ' + Math.round(box.height) + ' over content ' + Math.round(natural)
              : 'EDGE TO EDGE',
          ),
      )
    }
    if (body) {
      lines.push(
        '  body ' +
          check(
            body.scrollWidth <= body.clientWidth,
            body.scrollHeight > body.clientHeight ? 'scrolls down only' : 'fits',
            'SIDEWAYS ' + body.scrollWidth + '>' + body.clientWidth,
          ),
      )
    }
    // The state the whole --keyboard-inset mechanism exists for, and a phone's alone:
    // the decimal keypad has no Done key, so a Save button under it leaves no way to
    // submit at all. The BUTTON is measured, not the footer's box, or a footer whose own
    // padding collapsed would still read as clear.
    const save = footer?.querySelector('button:last-of-type')
    if (!save || dialog) return
    doc.documentElement.style.setProperty('--keyboard-inset', keyboard + 'px')
    const covered = save.getBoundingClientRect().bottom - (viewport - keyboard)
    lines.push(
      '  save over ' +
        keyboard +
        'px keyboard ' +
        check(covered <= 1, 'clear', 'COVERED by ' + Math.round(covered) + 'px'),
    )
    doc.documentElement.style.removeProperty('--keyboard-inset')
  }

  for (const width of widths) {
    const figure = document.createElement('figure')
    const caption = document.createElement('figcaption')
    caption.textContent = width + 'px …'
    const frame = document.createElement('iframe')
    frame.width = width
    frame.height = height
    frame.src = './' + page + '.html'
    frame.addEventListener('load', () => {
      const doc = frame.contentDocument
      const root = doc.documentElement
      const header = doc.querySelector('.app__header')
      const add = doc.querySelector('.add-action')
      const token = resolve(doc, '--header-height')
      const tap = resolve(doc, '--tap-target')
      const measure = (node) => Math.round(node.getBoundingClientRect().height)

      const lines = [
        width +
          'x' +
          height +
          '  ' +
          check(
            root.scrollWidth <= root.clientWidth,
            'no sideways',
            'SIDEWAYS ' + root.scrollWidth + '>' + root.clientWidth,
          ),
      ]
      // A missing node has to read as a failure, not as "no data": these selectors
      // are what the measurements below are anchored to.
      if (!header) lines.push(bad('MISSING .app__header'))
      else {
        const px = measure(header)
        // Compared against the token only from 62rem, which is the only place anything
        // READS it: `.layout__aside`'s sticky offset. Below that there is no sticky
        // aside, and the band is legitimately taller — `.balance__direction` wraps
        // rather than truncating, deliberately, because 「{name}に支払い」 is
        // verb-final and a tail ellipsis would cut off which way the money runs. An
        // unconditional check flags every long name as a failure nothing can act on,
        // which is how a real one later gets ignored.
        const reads = width >= 62 * 16
        lines.push(
          'header ' +
            px +
            'px ' +
            (reads
              ? check(px <= token + 1, 'within token ' + token, '> token ' + token)
              : 'token ' + token + ' unread below 62rem'),
        )
      }
      if (!add) lines.push(bad('MISSING .add-action'))
      else {
        const px = measure(add)
        lines.push('add ' + px + 'px ' + check(px >= tap, 'tappable', '< tap target ' + tap))
      }
      measureSheet(doc, lines)
      caption.innerHTML = lines.join('\n')
    })
    figure.append(caption, frame)
    row.append(figure)
  }
</script>
</body>
</html>
