<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f7f5f2" />
    <meta name="color-scheme" content="light" />
    <!-- Inline, so it costs no request and there is no /favicon.ico 404. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%233d4e8b'/%3E%3Cpath d='M10 9l6 7 6-7' stroke='white' stroke-width='2.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M10.5 17.5h11M10.5 21h11M16 16v7' stroke='white' stroke-width='2.5' stroke-linecap='round'/%3E%3C/svg%3E"
    />
    <!--
      Plain absolute paths: Vite's dev server prepends `base` once, and %BASE_URL%
      would double it. iOS uses apple-touch-icon, not the favicon, for the tile.
    -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/icon-180.png" />
    <!-- Safari reads only the apple- prefixed tag; Chromium asks for the other. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Finances" />
    <!--
      The three hosts a launch talks to, in order, each serialized behind the last:
      warming them at parse time overlaps the handshakes with the bundle's boot.
      `crossorigin` is load-bearing: the real requests are anonymous CORS, and a
      credentialed socket sits in a pool they never reuse.
    -->
    <link rel="preconnect" href="https://script.google.com" crossorigin />
    <link rel="preconnect" href="https://script.googleusercontent.com" crossorigin />
    <link rel="preconnect" href="https://sheets.googleapis.com" crossorigin />
    <!--
      `script-src 'self'`: no third-party script runs; the token comes over fetch.
      script.googleusercontent.com is where /exec 302s to, and browsers differ on
      checking connect-src against a redirect. This tag does not cover the service
      worker, which is why it never intercepts a cross-origin request.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="
        default-src 'self';
        script-src 'self';
        frame-src 'none';
        connect-src 'self' https://sheets.googleapis.com https://script.google.com https://script.googleusercontent.com;
        img-src 'self' data:;
        style-src 'self' 'unsafe-inline';
        font-src 'self';
        base-uri 'none';
        object-src 'none';
        form-action 'none';
      "
    />
    <title>Shared Finances</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
