<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f7f5f2" />
    <meta name="color-scheme" content="light" />
    <!--
      An inline data-URI favicon rather than a file: it costs no request at all,
      and without one every page load logs a 404 for /favicon.ico. Covered by
      `img-src 'self' data:` in the CSP below.
    -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%233d4e8b'/%3E%3Cpath d='M10 9l6 7 6-7' stroke='white' stroke-width='2.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M10.5 17.5h11M10.5 21h11M16 16v7' stroke='white' stroke-width='2.5' stroke-linecap='round'/%3E%3C/svg%3E"
    />
    <!--
      Home Screen install (iOS Safari 26+): Share -> Add to Home Screen. No
      service worker — iOS needs none for installability, and one would only
      add cache-invalidation risk on deploy that this static site has avoided
      so far. `apple-touch-icon` (not the SVG favicon) is what iOS actually
      uses for the home screen tile and splash flash; PNGs live in `public/`.
    -->
    <!-- Plain absolute paths, like the script tag below: Vite's dev server
         prepends `base` to a leading-slash href exactly once. %BASE_URL%
         already resolves to the base itself, so using it here would double
         it (`/verbose-octo-pancake/verbose-octo-pancake/...`) in dev. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/icon-180.png" />
    <!-- Safari still only recognizes the apple- prefixed tag; the unprefixed
         one is the standards-track name Chromium now asks for instead.
         Harmless to ship both. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Finances" />
    <!--
      Locked down to what the app actually needs: Google's auth, API, and
      Picker hosts. No third-party CDNs, no inline script beyond the bundle.
      The Picker is the reason docs.google.com/drive.google.com appear under
      frame-src and gstatic under script-src — it renders in a Google iframe.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="
        default-src 'self';
        script-src 'self' https://accounts.google.com https://apis.google.com https://www.gstatic.com https://ssl.gstatic.com;
        frame-src https://accounts.google.com https://docs.google.com https://drive.google.com;
        connect-src 'self' https://sheets.googleapis.com https://www.googleapis.com https://content.googleapis.com https://accounts.google.com;
        img-src 'self' data: blob: https://*.googleusercontent.com https://ssl.gstatic.com https://www.gstatic.com https://drive-thirdparty.googleusercontent.com;
        style-src 'self' 'unsafe-inline';
        font-src 'self';
        base-uri 'none';
        object-src 'none';
        form-action 'none';
      "
    />
    <title>Shared Finances</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
